<!DOCTYPE html>
<html lang="no">
<head>

<title>Oppsal – Alle Jenter på Banen 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #EAF2FB;
    color: #0A1F4A;
    min-height: 100vh;
    padding: 0 0 3rem;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #D0E3F5;
    padding: 1.1rem 1rem 1rem;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-title {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: #0A1F4A;
    margin-bottom: 10px;
  }

  .header-sub {
    font-size: 12px;
    color: #7AAAE0;
    margin-top: -6px;
    margin-bottom: 10px;
    font-weight: 400;
  }

  .day-btns {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }

  .dbtn {
    flex: 1;
    padding: 9px 4px;
    border: 1px solid #D0E3F5;
    background: #fff;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: #2D5FBF;
    transition: all .15s;
    text-align: center;
  }

  .dbtn.active {
    background: #1E4696;
    color: #fff;
    border-color: #1E4696;
  }

  .lag-btns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-bottom: 8px;
  }

  .spiller-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .spiller-input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #D0E3F5;
    border-radius: 99px;
    font-size: 13px;
    font-family: inherit;
    color: #0A1F4A;
    outline: none;
    transition: border-color .15s;
    background: #fff;
  }

  .spiller-input:focus {
    border-color: #7AAAE0;
  }

  .spiller-input::placeholder {
    color: #A8C5EC;
  }

  .spiller-clear {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    color: #7AAAE0;
    padding: 4px;
    line-height: 1;
    flex-shrink: 0;
  }

  .spiller-clear.vis { display: flex; align-items: center; }

  .spiller-tag {
    display: none;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: #1E4696;
    padding: 3px 10px 3px 12px;
    background: #D0E3F5;
    border-radius: 99px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .spiller-tag.vis { display: inline-flex; }

  .spiller-wrap {
    position: relative;
    flex: 1;
  }

  .spiller-suggestions {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid #D0E3F5;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(10,31,74,.08);
    overflow: hidden;
    z-index: 20;
  }

  .spiller-suggestions.vis { display: block; }

  .sug-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
    gap: 8px;
  }

  .sug-item:not(:last-child) { border-bottom: 1px solid #EAF2FB; }

  .sug-item:hover, .sug-item.focused { background: #EAF2FB; }

  .sug-initial {
    font-weight: 600;
    color: #0A1F4A;
    letter-spacing: 0.5px;
  }

  .sug-match {
    color: #4A7ED4;
  }

  .sug-lag {
    font-size: 11px;
    font-weight: 500;
    border-radius: 99px;
    padding: 2px 9px;
    flex-shrink: 0;
  }

  .lbtn {
    padding: 8px 4px;
    border: 1px solid #D0E3F5;
    background: #fff;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    color: #2D5FBF;
    transition: all .15s;
    text-align: center;
    white-space: nowrap;
  }

  .lbtn.active-alle { background: #0A1F4A; color: #fff; border-color: #0A1F4A; }
  .lbtn.active-1   { background: #1E4696; color: #fff; border-color: #1E4696; }
  .lbtn.active-2   { background: #1B6E8F; color: #fff; border-color: #1B6E8F; }
  .lbtn.active-3   { background: #1a7040; color: #fff; border-color: #1a7040; }
  .lbtn.active-4   { background: #7241d4; color: #fff; border-color: #7241d4; }
  .lbtn.active-5   { background: #c26212; color: #fff; border-color: #c26212; }

  main {
    padding: 1rem 0.85rem 0;
    max-width: 600px;
    margin: 0 auto;
  }

  .count {
    font-size: 12px;
    color: #7AAAE0;
    margin-bottom: 0.6rem;
    padding: 0 2px;
  }

  .kamp {
    background: #fff;
    border-radius: 12px;
    border: 1px solid #D0E3F5;
    padding: 13px 14px 11px;
    margin-bottom: 8px;
  }

  .kamp-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;

  }

  .lag-badge {
    border-radius: 99px;

  }

  .b1 { background: #D0E3F5; color: #1E4696; }
  .b2 { background: #cce8f0; color: #1B6E8F; }
  .b3 { background: #d4f0e3; color: #1a7040; }

    font-size: 26px;

  }

  .kamp-teams {

    font-weight: 600;

  }

  .kamp-arena {
    font-size: 12px;
    color: #7AAAE0;
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .kamp-arena svg {
    flex-shrink: 0;
    opacity: .6;
  }

  .nedtelling {
    margin-top: 9px;
    padding-top: 9px;
    border-top: 1px solid #D0E3F5;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: #A8C5EC;
    min-height: 22px;
  }

  .nd-label { color: #A8C5EC; }

  .nd-tall {
    font-size: 14px;
    font-weight: 700;
    color: #0A1F4A;
  }

  .nd-snart {
    font-size: 14px;
    font-weight: 700;
    color: #1B6E8F;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }

  .nd-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border-radius: 99px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 600;
  }

  .nd-startet  { background: #D0E3F5; color: #1E4696; }
  .nd-avsluttet { background: #EAF2FB; color: #A8C5EC; }

  .empty {
    text-align: center;
    color: #A8C5EC;
    padding: 3rem 1rem;
    font-size: 14px;
  }

  @media (min-width: 480px) {
    .kamp-tid { font-size: 30px; }
  }
</style>

  {lag:2,dag:'søndag',hjem:'Oppsal 2',borte:'Sannidal IL',tid:'12:40',arena:'Østfold energi arena 26'},
  {lag:3,dag:'søndag',hjem:'Skiens Grane IF 2',borte:'Oppsal 3',tid:'13:00',arena:'Park & Anlegg Arena 8'},

  {lag:2,dag:'søndag',hjem:'Trøgstad/Båstad FK',borte:'Oppsal 2',tid:'13:20',arena:'Park & Anlegg Arena 8'},

  {lag:2,dag:'søndag',hjem:'Oppsal 2',borte:'Kolbotn IL Blå',tid:'14:20',arena:'Østfold energi arena 26'},
  {lag:4,dag:'søndag',hjem:'Råde IL 2',borte:'Oppsal 4',tid:'14:40',arena:'Park & Anlegg Arena 1'},
  {lag:2,dag:'søndag',hjem:'Rolvsøy IF 1',borte:'Oppsal 2',tid:'15:00',arena:'Østfold energi arena 30'},
  {lag:1,dag:'søndag',hjem:'Sportsklubben Rapid - Moss 2',borte:'Oppsal 1',tid:'15:00',arena:'Park & Anlegg Arena 4'},
  {lag:4,dag:'søndag',hjem:'Oppsal 4',borte:'Gjelleråsen Rød',tid:'15:20',arena:'Østfold energi arena 28'},
  {lag:3,dag:'søndag',hjem:'Oppsal 3',borte:'Rustad Abildsø SK 1',tid:'15:20',arena:'Østfold energi arena 31'},
  {lag:1,dag:'søndag',hjem:'Oppsal 1',borte:'Jutul, IL',tid:'16:00',arena:'Park & Anlegg Arena 7'},
  {lag:1,dag:'søndag',hjem:'Ås IL Fotball',borte:'Oppsal 1',tid:'16:40',arena:'Østfold energi arena 26'},
  {lag:1,dag:'søndag',hjem:'Oppsal 1',borte:'Askim Fotball Hvit',tid:'17:40',arena:'Park & Anlegg Arena 6'},
];

const dagDato = { lørdag: '2026-05-30', søndag: '2026-05-31' };
const badges  = { 1:'b1', 2:'b2', 3:'b3', 4:'b4', 5:'b5' };

const spillerLag = {};
[
  [1, ['AWK','STS','IB','CCG','AA','AN','IUTO']],
  [2, ['AAA','HMH','MA','KR','SM','ES','CLK']],
  [3, ['ALBB','ES','YFW','ADN','AHR','VA','MZ']],
  [4, ['LBM','EC','JWN','AA','AG','VN']],
  [5, ['OSM','IBT','FRV','IST','ORC','EH','SNK']],
].forEach(([lag, initialer]) => {
  initialer.forEach(i => {
    if (!spillerLag[i]) spillerLag[i] = [];
    spillerLag[i].push(lag);
  });
});

let aktivLag = 'alle', aktivDag = 'alle', aktivSpiller = null;
let synlige = [];

function kampStart(k) {
  const [hh, mm] = k.tid.split(':').map(Number);
  const d = new Date(dagDato[k.dag]);
  d.setHours(hh, mm, 0, 0);
  return d;
}

function nedtellingHTML(k) {
  const now   = new Date();
  const start = kampStart(k);
  const slutt = new Date(start.getTime() + 30 * 60 * 1000);

  if (now >= slutt) {
    return `<span class="nd-pill nd-avsluttet">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      Avsluttet
    </span>`;
  }

  if (now >= start) {
    return `<span class="nd-pill nd-startet">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/></svg>
      Startet
    </span>`;
  }

  const sek  = Math.floor((start - now) / 1000);
  const min  = Math.floor(sek / 60);
  const timer = Math.floor(min / 60);
  const dager = Math.floor(timer / 24);

  const pinSVG = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>`;

  if (min < 60) {
    const s = sek % 60;
    const m = min % 60;
    return `${pinSVG} <span class="nd-label">starter om</span> <span class="nd-snart">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</span>`;
  }
  if (timer < 24) {
    const h = timer;
    const m = min % 60;
    return `${pinSVG} <span class="nd-label">starter om</span> <span class="nd-tall">${h}t ${m}min</span>`;
  }
  return `${pinSVG} <span class="nd-label">starter om</span> <span class="nd-tall">${dager}d ${timer % 24}t</span>`;
}

function setDay(dag) {
  aktivDag = dag;
  document.querySelectorAll('.dbtn').forEach((b, i) => {
    b.classList.toggle('active', ['alle','lørdag','søndag'][i] === dag);
  });
  render();
}

function setLag(lag) {
  aktivLag = lag;
  aktivSpiller = null;
  document.getElementById('spiller-input').value = '';
  document.getElementById('spiller-clear').classList.remove('vis');
  document.getElementById('spiller-tag').classList.remove('vis');
  const btns = document.querySelectorAll('.lbtn');
  btns.forEach(b => b.className = 'lbtn');
  if (lag === 'alle') btns[0].classList.add('active-alle');
  else btns[lag].classList.add('active-' + lag);
  render();
}

const lagColors = { 1:'b1', 2:'b2', 3:'b3', 4:'b4', 5:'b5' };
const lagNames  = { 1:'Oppsal 1', 2:'Oppsal 2', 3:'Oppsal 3', 4:'Oppsal 4', 5:'Oppsal 5' };
let sugFocusIdx = -1;

function getSuggestions(key) {
  if (!key) return [];
  return Object.keys(spillerLag)
    .filter(i => i.startsWith(key))
    .sort()
    .slice(0, 6);
}

function renderSuggestions(key) {
  const box = document.getElementById('spiller-suggestions');
  const matches = getSuggestions(key);
  sugFocusIdx = -1;
  if (!key || matches.length === 0) { box.classList.remove('vis'); return; }

  box.innerHTML = matches.map((init, idx) => {
    const lag = spillerLag[init];
    const lagLabel = lag.map(l => lagNames[l]).join(' & ');
    const highlighted = `<span class="sug-match">${init.slice(0, key.length)}</span>${init.slice(key.length)}`;
    const pills = lag.map(l =>
      `<span class="sug-lag ${lagColors[l]}">${lagNames[l]}</span>`
    ).join(' ');
    return `<div class="sug-item" data-init="${init}" onmousedown="selectSuggestion('${init}')">${
      '<span class="sug-initial">' + highlighted + '</span>'
    }${pills}</div>`;
  }).join('');
  box.classList.add('vis');
}

function selectSuggestion(init) {
  document.getElementById('spiller-input').value = init;
  document.getElementById('spiller-suggestions').classList.remove('vis');
  applySpiller(init);
}

function onSpillerInput(val) {
  const key = val.trim().toUpperCase();
  document.getElementById('spiller-clear').classList.toggle('vis', val.length > 0);
  renderSuggestions(key);

  if (!key) {
    aktivSpiller = null;
    document.getElementById('spiller-tag').classList.remove('vis');
    resetLagBtns();
    render();
    return;
  }

  applySpiller(key);
}

function applySpiller(key) {
  const tag = document.getElementById('spiller-tag');
  const lag = spillerLag[key] || null;
  aktivSpiller = lag;

  if (lag) {
    tag.textContent = lag.length > 1 ? `Lag ${lag.join(' & ')}` : lagNames[lag[0]];
    tag.classList.add('vis');
  } else {
    tag.textContent = 'Ikke funnet';
    tag.classList.add('vis');
  }
  resetLagBtns();
  render();
}

function onSpillerKey(e) {
  const box = document.getElementById('spiller-suggestions');
  const items = box.querySelectorAll('.sug-item');
  if (!box.classList.contains('vis') || items.length === 0) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    sugFocusIdx = Math.min(sugFocusIdx + 1, items.length - 1);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    sugFocusIdx = Math.max(sugFocusIdx - 1, 0);
  } else if (e.key === 'Enter' && sugFocusIdx >= 0) {
    e.preventDefault();
    selectSuggestion(items[sugFocusIdx].dataset.init);
    return;
  } else if (e.key === 'Escape') {
    box.classList.remove('vis');
    return;
  } else { return; }

  items.forEach((el, i) => el.classList.toggle('focused', i === sugFocusIdx));
}

function clearSpiller() {
  aktivSpiller = null;
  document.getElementById('spiller-input').value = '';
  document.getElementById('spiller-clear').classList.remove('vis');
  document.getElementById('spiller-tag').classList.remove('vis');
  document.getElementById('spiller-suggestions').classList.remove('vis');
  resetLagBtns();
  render();
}

function resetLagBtns() {
  const btns = document.querySelectorAll('.lbtn');
  btns.forEach(b => b.className = 'lbtn');
  if (aktivLag === 'alle') btns[0].classList.add('active-alle');
  else btns[aktivLag].classList.add('active-' + aktivLag);
}

function render() {
  synlige = kamper
    .map((k, i) => ({ ...k, _i: i }))
    .filter(k => {
      const lagOK = aktivSpiller
        ? (aktivSpiller.includes(k.lag))
        : (aktivLag === 'alle' || k.lag === aktivLag);
      return lagOK && (aktivDag === 'alle' || k.dag === aktivDag);
    });

  document.getElementById('count').textContent = synlige.length + ' kamper';

  const el = document.getElementById('liste');
  if (!synlige.length) {
    el.innerHTML = '<div class="empty">Ingen kamper funnet</div>';
    return;
  }

  el.innerHTML = synlige.map((k, i) => {
    const dagLabel = k.dag === 'lørdag' ? 'Lør 30. mai' : 'Søn 31. mai';
    return `<div class="kamp">
      <div class="kamp-top">
        <span class="lag-badge ${badges[k.lag]}">Oppsal ${k.lag}</span>
        <div class="kamp-tidblokk">
          <div class="kamp-tid">${k.tid}</div>
          <div class="kamp-dag">${dagLabel}</div>
        </div>
      </div>
      <div class="kamp-teams">${k.hjem} – ${k.borte}</div>
      <div class="kamp-arena">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
        ${k.arena}
      </div>
      <div class="nedtelling" id="nd-${i}">${nedtellingHTML(k)}</div>
    </div>`;
  }).join('');
}

function tick() {
  synlige.forEach((k, i) => {
    const el = document.getElementById('nd-' + i);
    if (el) el.innerHTML = nedtellingHTML(k);
  });
}

render();
setInterval(tick, 1000);

document.addEventListener('click', e => {
  if (!e.target.closest('.spiller-wrap')) {
    document.getElementById('spiller-suggestions').classList.remove('vis');
  }
});
</script>
</body>
</html>
